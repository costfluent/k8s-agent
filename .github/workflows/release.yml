name: release

# Runs on a vX.Y.Z tag. The image package belongs to this repository, so GITHUB_TOKEN can push to
# it and no registry secret is needed.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # A tag run restores caches the default branch wrote, and a restored module skips the go.sum check.
          cache: false
      # The last chance to stop a broken agent before its image reaches customers' clusters.
      - name: Test
        run: go test ./...
      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The chart resolves image.tag from Chart.yaml appVersion, so the plain semver tag is the one
      # customers actually pull; `latest` is a convenience and nothing should depend on it.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The tagged commit's time, so rebuilding a tag reproduces the same BuildTime.
      - name: Commit time
        id: commit
        run: echo "time=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)" >> "$GITHUB_OUTPUT"

      # Both architectures matter for a cost agent: arm64 node pools are one of the cheapest
      # optimisations a customer makes, so shipping amd64 only would exclude the clusters most
      # likely to care about cost.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.commit.outputs.time }}

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "First push creates the package **private**. Make it public once, by hand:"
            echo "Organization -> Packages -> k8s-agent -> Package settings -> Change visibility."
          } >> "$GITHUB_STEP_SUMMARY"
