name: release

# Mirrored from the Costfluent monorepo at toolkit/k8s-agent/ and runs in the public repository,
# which is where it has to run: the package it pushes belongs to that repository, so GITHUB_TOKEN
# can push to it and no registry secret is needed anywhere.
#
# Do not edit this file here. Edit it in the monorepo and publish; a change made in the public
# repository is destroyed by the next sync.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: build and push image
    runs-on: self-hosted-dind
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The chart resolves image.tag from Chart.yaml appVersion, so the plain semver tag is the one
      # customers actually pull; `latest` is a convenience and nothing should depend on it.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The tagged commit's time, so rebuilding a tag reproduces the same BuildTime.
      - name: Commit time
        id: commit
        run: echo "time=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)" >> "$GITHUB_OUTPUT"

      # Both architectures matter for a cost agent: arm64 node pools are one of the cheapest
      # optimisations a customer makes, so shipping amd64 only would exclude the clusters most
      # likely to care about cost.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.commit.outputs.time }}

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "First push creates the package **private**. Make it public once, by hand:"
            echo "Organization -> Packages -> k8s-agent -> Package settings -> Change visibility."
          } >> "$GITHUB_STEP_SUMMARY"
